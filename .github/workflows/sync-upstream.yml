name: 同步上游 (Sync upstream)

on:
  # 每 6 小时自动同步一次上游（UTC 时间，00:10 / 06:10 / 12:10 / 18:10）
  schedule:
    - cron: '10 */6 * * *'
  # 也可以在 Actions 页面手动点 "Run workflow"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true

      - name: 配置 git 身份
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 添加上游远程
        run: |
          git remote add upstream https://github.com/WiIIiam278/HuskSync.git || \
          git remote set-url upstream https://github.com/WiIIiam278/HuskSync.git

      - name: 抓取上游
        run: git fetch --no-tags upstream master

      - name: 合并上游（保留本仓库自己的 workflow 文件）
        id: merge
        run: |
          UPSTREAM_SHA=$(git rev-parse --short upstream/master)
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "已经是最新，无需同步。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 用 merge（而不是 reset），这样本仓库自己添加的 workflow / 说明文件不会被冲掉
          if git merge --no-edit -m "chore: 同步上游 @${UPSTREAM_SHA}" upstream/master; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::自动合并出现冲突，需要人工处理。"
            git merge --abort || true
            exit 1
          fi

      - name: 推送
        if: steps.merge.outputs.changed == 'true'
        run: git push origin master

      - name: 同步结果
        if: steps.merge.outputs.changed == 'true'
        run: echo "已同步上游 ${{ steps.merge.outputs.upstream_sha }}，构建 workflow 会自动开始。"
